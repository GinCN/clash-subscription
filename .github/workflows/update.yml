
name: Update Clash Subscription

on:
  schedule:
    - cron: "10 8 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download today's subscription
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(TZ=Asia/Singapore date +%Y%m%d)
          YEAR=$(TZ=Asia/Singapore date +%Y)
          MONTH=$(TZ=Asia/Singapore date +%m)

          URL="https://node.freev2raynode.com/uploads/${YEAR}/${MONTH}/1-${DATE}.yaml"

          echo "Trying: ${URL}"

          curl --fail --silent --show-error \
            --location --max-time 60 \
            "$URL" -o subscription.yaml

          test -s subscription.yaml

          echo "Subscription downloaded successfully."

      - name: Commit updated subscription
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Clash subscription"
            git push
          fi
