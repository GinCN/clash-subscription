name: Update Clash Subscription

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset and Clean workspace
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git config pull.rebase false

      - name: Fetch and Process Subscription
        env:
          TZ: 'Asia/Shanghai'
        run: |
          TODAY=$(date +'%Y%m%d')
          export FORMATTED_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          export URL="https://node.freev2raynode.com/uploads/2026/10/1-${TODAY}.yaml"
          
          echo "正在下载: $URL"
          # 增加 User-Agent 伪装，避免返回错误页面
          curl -f -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -o temp-sub.yaml "$URL"
          if [ $? -ne 0 ]; then
             echo "❌ 下载失败！请检查今天的日期链接是否已经发布。"
             exit 1
          fi
          
          # 检查文件大小和内容类型
          FILE_SIZE=$(stat -c%s temp-sub.yaml)
          echo "下载文件大小: $FILE_SIZE 字节"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "⚠️ 下载的文件过小，可能是错误页面。内容如下："
            cat temp-sub.yaml
            exit 1
          fi
          
          pip install pyyaml
          
          cat << 'PYEOF' > process.py
          import yaml, sys, os, base64, re
          
          date_str = os.environ.get('FORMATTED_DATE')
          url = os.environ.get('URL')
          node_name = f'📅 更新时间: {date_str}'
          
          def try_parse_yaml(content):
              """尝试解析 YAML，如果失败则尝试提取 YAML 块或 Base64 解码"""
              # 1. 尝试直接解析
              try:
                  return yaml.safe_load(content)
              except yaml.parser.ParserError:
                  pass
              
              # 2. 尝试提取 --- 之间的内容
              yaml_blocks = re.findall(r'---\s*\n(.*?)(?:\n---|\Z)', content, re.DOTALL)
              for block in yaml_blocks:
                  try:
                      return yaml.safe_load(block)
                  except:
                      continue
              
              # 3. 尝试 Base64 解码
              try:
                  # 移除空白字符
                  b64_str = re.sub(r'\s+', '', content)
                  # 补齐 padding
                  b64_str += '=' * (-len(b64_str) % 4)
                  decoded = base64.b64decode(b64_str).decode('utf-8')
                  return yaml.safe_load(decoded)
              except:
                  pass
              
              # 4. 尝试作为纯文本节点列表解析（每行一个节点）
              try:
                  lines = [line.strip() for line in content.split('\n') if line.strip()]
                  if all('://' in line for line in lines[:3]):  # 简单判断是否是节点列表
                      proxies = []
                      for i, line in enumerate(lines):
                          # 这里需要根据实际节点格式进行解析，这里仅作示例
                          # 实际中可能需要更复杂的解析逻辑
                          pass
              except:
                  pass
              
              return None
          
          # 读取文件内容
          with open('temp-sub.yaml', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          
          # 尝试解析
          data = try_parse_yaml(content)
          
          if data is None:
              print('❌ 无法解析下载的内容。文件头几行内容如下：')
              print('\n'.join(content.split('\n')[:10]))
              print('\n请检查订阅链接是否返回了正确的 Clash 配置。')
              sys.exit(1)
          
          if not isinstance(data, dict) or 'proxies' not in data:
              # 如果不是标准的 Clash 配置，尝试直接保存原始内容
              print('⚠️ 下载的内容不是标准的 Clash YAML 配置，将直接保存原始内容。')
              with open('subscription.yaml', 'w', encoding='utf-8') as f:
                  f.write(f'# 更新时间: {date_str}\n# 数据源: {url}\n\n')
                  f.write(content)
              sys.exit(0)
          
          # 构造展示节点
          dummy_node = {
              'name': node_name, 'type': 'ss', 'server': '127.0.0.1', 
              'port': 1, 'cipher': 'aes-128-gcm', 'password': 'dummy'
          }
          
          # 过滤旧节点并插入新节点
          data['proxies'] = [p for p in data['proxies'] if isinstance(p, dict) and not str(p.get('name', '')).startswith('📅 更新时间:')]
          data['proxies'].insert(0, dummy_node)
          
          if 'proxy-groups' in data:
              for group in data['proxy-groups']:
                  if isinstance(group, dict) and 'proxies' in group:
                      group['proxies'] = [p for p in group['proxies'] if not str(p).startswith('📅 更新时间:')]
                      group['proxies'].insert(0, node_name)
                      
          # 写出最终文件
          with open('subscription.yaml', 'w', encoding='utf-8') as f:
              f.write(f'# 更新时间: {date_str}\n# 数据源: {url}\n\n')
              yaml.dump(data, f, allow_unicode=True, sort_keys=False)
          PYEOF
          
          python3 process.py
          rm temp-sub.yaml process.py

      - name: Commit and force push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A subscription.yaml
          
          if git diff --staged --quiet; then
            echo "✅ 文件内容没有变化，无需提交。"
            exit 0
          fi
          
          git commit -m "Update subscription for $(date +'%Y-%m-%d')"
          
          echo "正在强制推送到仓库..."
          git push origin HEAD:main -f
          
          echo "✅ 推送成功！"
